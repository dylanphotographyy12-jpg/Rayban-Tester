<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=600, height=600, initial-scale=1.0">

<title>Ray-Ban Control Test</title>

<style>
html, body {
    width: 600px;
    height: 600px;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: black;
    color: white;
    font-family: Arial, sans-serif;
}

#app {
    width: 600px;
    height: 600px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
}

#title {
    font-size: 32px;
    font-weight: bold;
    margin-bottom: 50px;
}

#input {
    font-size: 42px;
    font-weight: bold;
    margin-bottom: 40px;
}

#history {
    font-size: 20px;
    line-height: 1.6;
}
</style>
</head>

<body>

<div id="app">

    <div id="title">
        RAY-BAN CONTROL TEST
    </div>

    <div id="input">
        READY
    </div>

    <div id="history">
        Press a control...
    </div>

</div>

<script>

let history = [];

const inputDisplay = document.getElementById("input");
const historyDisplay = document.getElementById("history");

function received(input) {

    inputDisplay.textContent = input;

    history.unshift(input);

    history = history.slice(0, 6);

    historyDisplay.innerHTML = history.join("<br>");
}

document.addEventListener("keydown", function(event) {

    const validInputs = [
        "ArrowUp",
        "ArrowDown",
        "ArrowLeft",
        "ArrowRight",
        "Enter",
        "Escape"
    ];

    if (!validInputs.includes(event.key)) {
        return;
    }

    event.preventDefault();

    received(event.key);

});

</script>

</body>
</html>
