<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=600, height=600, initial-scale=1.0">

<title>Minecraft Controller</title>

<style>

html, body {
    width: 600px;
    height: 600px;

    margin: 0;
    padding: 0;

    overflow: hidden;

    background: black;
    color: white;

    font-family: Arial, sans-serif;
}

#app {
    width: 600px;
    height: 600px;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    text-align: center;
}

#title {
    font-size: 28px;
    font-weight: bold;
    margin-bottom: 25px;
}

#connection {
    font-size: 18px;
    margin-bottom: 20px;
}

#arrow {
    font-size: 90px;
    line-height: 1;
    margin-bottom: 15px;
}

#direction {
    font-size: 40px;
    font-weight: bold;
    margin-bottom: 20px;
}

#status {
    font-size: 22px;
}

#hint {
    font-size: 16px;
    opacity: 0.6;
    margin-top: 25px;
}

</style>

</head>

<body>

<div id="app">

    <div id="title">
        MINECRAFT CONTROLLER
    </div>

    <div id="connection">
        CONNECTING...
    </div>

    <div id="arrow">
        ●
    </div>

    <div id="direction">
        STOPPED
    </div>

    <div id="status">
        READY
    </div>

    <div id="hint">
        Opposite direction = STOP
    </div>

</div>


<script>

/* =========================================
   WEBSOCKET CONNECTION
   ========================================= */

const socket = new WebSocket(
    "wss://convenient-plumbing-classification-meant.trycloudflare.com"
);


const connection =
    document.getElementById("connection");


socket.onopen = function() {

    connection.textContent =
        "PC CONNECTED";

};


socket.onclose = function() {

    connection.textContent =
        "PC DISCONNECTED";

};


socket.onerror = function() {

    connection.textContent =
        "CONNECTION ERROR";

};


/* =========================================
   SEND COMMAND TO PC
   ========================================= */

function sendCommand(command) {

    if (socket.readyState === WebSocket.OPEN) {

        socket.send(command);

        console.log("SENT:", command);

    }

}


/* =========================================
   MOVEMENT STATE
   ========================================= */

let movement = "stopped";


const arrow =
    document.getElementById("arrow");

const direction =
    document.getElementById("direction");

const status =
    document.getElementById("status");


/* =========================================
   UPDATE DISPLAY
   ========================================= */

function updateDisplay() {

    if (movement === "forward") {

        arrow.textContent = "▲";

        direction.textContent =
            "FORWARD";

        status.textContent =
            "MOVING";

    }

    else if (movement === "backward") {

        arrow.textContent = "▼";

        direction.textContent =
            "BACKWARD";

        status.textContent =
            "MOVING";

    }

    else if (movement === "left") {

        arrow.textContent = "◀";

        direction.textContent =
            "LEFT";

        status.textContent =
            "MOVING";

    }

    else if (movement === "right") {

        arrow.textContent = "▶";

        direction.textContent =
            "RIGHT";

        status.textContent =
            "MOVING";

    }

    else {

        arrow.textContent = "●";

        direction.textContent =
            "STOPPED";

        status.textContent =
            "READY";

    }

}


/* =========================================
   FORWARD
   ========================================= */

function forward() {

    if (movement === "forward") {

        return;

    }


    if (movement === "backward") {

        movement = "stopped";

        sendCommand("STOP_BACKWARD");

    }

    else {

        movement = "forward";

        sendCommand("FORWARD");

    }


    updateDisplay();

}


/* =========================================
   BACKWARD
   ========================================= */

function backward() {

    if (movement === "backward") {

        return;

    }


    if (movement === "forward") {

        movement = "stopped";

        sendCommand("STOP_FORWARD");

    }

    else {

        movement = "backward";

        sendCommand("BACKWARD");

    }


    updateDisplay();

}


/* =========================================
   LEFT
   ========================================= */

function left() {

    if (movement === "left") {

        return;

    }


    if (movement === "right") {

        movement = "stopped";

        sendCommand("STOP_RIGHT");

    }

    else {

        movement = "left";

        sendCommand("LEFT");

    }


    updateDisplay();

}


/* =========================================
   RIGHT
   ========================================= */

function right() {

    if (movement === "right") {

        return;

    }


    if (movement === "left") {

        movement = "stopped";

        sendCommand("STOP_LEFT");

    }

    else {

        movement = "right";

        sendCommand("RIGHT");

    }


    updateDisplay();

}


/* =========================================
   GLASSES INPUT
   ========================================= */

document.addEventListener(
    "keydown",
    function(event) {

        event.preventDefault();


        switch (event.key) {

            case "ArrowUp":

                forward();

                break;


            case "ArrowDown":

                backward();

                break;


            case "ArrowLeft":

                left();

                break;


            case "ArrowRight":

                right();

                break;


            case "Enter":

                sendCommand("ACTION");

                status.textContent =
                    "ACTION";

                break;

        }

    }
);

</script>

</body>
</html>
