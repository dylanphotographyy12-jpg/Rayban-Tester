```html
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=600,height=600">
<title>Ray-Ban Minecraft</title>

<style>
html,body{
    margin:0;
    padding:0;
    width:600px;
    height:600px;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

#game{
    position:relative;
    width:600px;
    height:600px;
    overflow:hidden;
    background:#75c7ff;
}

/* SKY */

#sky{
    position:absolute;
    inset:0;
    background:linear-gradient(
        #55b7ff 0%,
        #8bd4ff 65%,
        #d9f1ff 100%
    );
}

/* SUN */

#sun{
    position:absolute;
    width:75px;
    height:75px;
    background:#fff;
    border-radius:50%;
    top:50px;
    right:75px;
    box-shadow:0 0 30px #fff;
}

/* GAME WORLD */

#world{
    position:absolute;
    left:0;
    top:130px;
    width:600px;
    height:350px;
    perspective:700px;
    overflow:hidden;
}

/* GROUND */

#ground{
    position:absolute;
    left:-300px;
    top:170px;
    width:1200px;
    height:500px;

    background:
        repeating-linear-gradient(
            45deg,
            #4c9638 0px,
            #4c9638 25px,
            #438531 25px,
            #438531 50px
        );

    transform:
        rotateX(62deg)
        rotateZ(0deg);

    transform-origin:center top;
}

/* BLOCKS */

.block{
    position:absolute;
    width:45px;
    height:45px;
    box-sizing:border-box;
    border:2px solid rgba(0,0,0,.25);
}

.grass{
    background:#55a83b;
}

.dirt{
    background:#87572c;
}

.stone{
    background:#777;
}

.wood{
    background:#76502d;
}

.leaves{
    background:#2e8134;
}

/* CROSSHAIR */

#crosshair{
    position:absolute;
    left:50%;
    top:47%;
    transform:translate(-50%,-50%);
    color:white;
    font-size:32px;
    font-weight:bold;
    text-shadow:
        2px 2px 2px black,
        -2px -2px 2px black;
    z-index:20;
}

/* HUD */

#hud{
    position:absolute;
    left:15px;
    top:15px;
    z-index:30;
    color:white;
    font-size:19px;
    text-shadow:2px 2px 3px black;
}

#health{
    margin-top:4px;
}

#hunger{
    margin-top:3px;
}

/* COORDINATES */

#coords{
    position:absolute;
    right:15px;
    top:15px;
    color:white;
    font-size:15px;
    text-shadow:2px 2px 3px black;
    z-index:30;
}

/* HOTBAR */

#hotbar{
    position:absolute;
    bottom:12px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:4px;
    z-index:40;
}

.slot{
    width:42px;
    height:42px;
    border:3px solid #555;
    background:#222;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:21px;
    box-sizing:border-box;
}

.slot.selected{
    border:3px solid white;
}

/* CONTROLS */

#controls{
    position:absolute;
    left:12px;
    bottom:65px;
    z-index:40;

    display:grid;

    grid-template-columns:
        48px 48px 48px;

    grid-template-rows:
        42px 42px 42px;

    gap:3px;
}

.control{
    background:rgba(0,0,0,.55);
    border:2px solid rgba(255,255,255,.8);
    border-radius:7px;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:23px;
}

#up{
    grid-column:2;
}

#left{
    grid-column:1;
    grid-row:2;
}

#down{
    grid-column:2;
    grid-row:3;
}

#right{
    grid-column:3;
    grid-row:2;
}

/* ACTIONS */

#actions{
    position:absolute;
    right:12px;
    bottom:65px;
    z-index:40;

    display:flex;
    flex-direction:column;
    gap:4px;
}

.action{
    width:90px;
    height:38px;
    border:2px solid white;
    border-radius:7px;
    background:rgba(0,0,0,.55);
    color:white;
    font-size:13px;
}

/* MESSAGE */

#message{
    position:absolute;
    left:50%;
    top:60px;
    transform:translateX(-50%);
    color:white;
    font-size:18px;
    text-shadow:2px 2px 3px black;
    z-index:40;
}
</style>
</head>

<body>

<div id="game">

    <div id="sky"></div>

    <div id="sun"></div>

    <div id="world">

        <div id="ground"></div>

        <!-- distant terrain -->

        <div class="block grass" style="left:80px;top:180px"></div>
        <div class="block dirt" style="left:80px;top:225px"></div>

        <div class="block grass" style="left:125px;top:180px"></div>
        <div class="block dirt" style="left:125px;top:225px"></div>

        <div class="block grass" style="left:170px;top:180px"></div>
        <div class="block dirt" style="left:170px;top:225px"></div>

        <!-- mountain -->

        <div class="block stone" style="left:310px;top:145px"></div>
        <div class="block stone" style="left:355px;top:145px"></div>

        <div class="block stone" style="left:265px;top:190px"></div>
        <div class="block stone" style="left:310px;top:190px"></div>
        <div class="block stone" style="left:355px;top:190px"></div>
        <div class="block stone" style="left:400px;top:190px"></div>

        <div class="block dirt" style="left:265px;top:235px"></div>
        <div class="block dirt" style="left:310px;top:235px"></div>
        <div class="block dirt" style="left:355px;top:235px"></div>
        <div class="block dirt" style="left:400px;top:235px"></div>

        <!-- TREE -->

        <div class="block wood" style="left:500px;top:175px"></div>
        <div class="block wood" style="left:500px;top:130px"></div>

        <div class="block leaves" style="left:455px;top:85px"></div>
        <div class="block leaves" style="left:500px;top:85px"></div>
        <div class="block leaves" style="left:545px;top:85px"></div>

        <div class="block leaves" style="left:500px;top:40px"></div>

    </div>

    <div id="crosshair">+</div>

    <div id="hud">

        <div>❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️</div>

        <div id="hunger">
            🍗🍗🍗🍗🍗🍗🍗🍗🍗🍗
        </div>

    </div>

    <div id="coords">
        X: 0<br>
        Y: 64<br>
        Z: 0
    </div>

    <div id="message">
        Minecraft
    </div>

    <div id="controls">

        <div class="control" id="up">▲</div>

        <div class="control" id="left">◀</div>

        <div class="control" id="down">▼</div>

        <div class="control" id="right">▶</div>

    </div>

    <div id="actions">

        <button class="action" id="jump">
            JUMP
        </button>

        <button class="action" id="break">
            ⛏ BREAK
        </button>

        <button class="action" id="place">
            PLACE
        </button>

    </div>

    <div id="hotbar">

        <div class="slot selected">🟩</div>
        <div class="slot">🟫</div>
        <div class="slot">🪨</div>
        <div class="slot">🪵</div>
        <div class="slot">🍃</div>
        <div class="slot">💎</div>

    </div>

</div>

<script>

/* =========================
   PLAYER
========================= */

let x = 0;
let y = 64;
let z = 0;

let rotation = 0;

let health = 20;
let hunger = 20;

let selectedBlock = 0;


/* =========================
   ELEMENTS
========================= */

const message =
    document.getElementById("message");

const coords =
    document.getElementById("coords");

const crosshair =
    document.getElementById("crosshair");


/* =========================
   MESSAGE
========================= */

function showMessage(text){

    message.textContent = text;

    clearTimeout(window.messageTimer);

    window.messageTimer =
        setTimeout(function(){

            message.textContent =
                "Minecraft";

        },700);
}


/* =========================
   UPDATE HUD
========================= */

function updateCoords(){

    coords.innerHTML =
        "X: " + Math.round(x) +
        "<br>Y: " + Math.round(y) +
        "<br>Z: " + Math.round(z);

}


/* =========================
   MOVEMENT
========================= */

function forward(){

    const radians =
        rotation * Math.PI / 180;

    x += Math.sin(radians);
    z += Math.cos(radians);

    updateCoords();

    showMessage("WALK");

}

function backward(){

    const radians =
        rotation * Math.PI / 180;

    x -= Math.sin(radians);
    z -= Math.cos(radians);

    updateCoords();

    showMessage("BACK");

}


/* =========================
   TURNING
========================= */

function turnLeft(){

    rotation -= 15;

    if(rotation < 0)
        rotation += 360;

    showMessage("TURN LEFT");

}

function turnRight(){

    rotation += 15;

    if(rotation >= 360)
        rotation -= 360;

    showMessage("TURN RIGHT");

}


/* =========================
   JUMP
========================= */

function jump(){

    showMessage("JUMP");

    y += 1;

    updateCoords();

    crosshair.style.top =
        "43%";

    setTimeout(function(){

        y -= 1;

        updateCoords();

        crosshair.style.top =
            "47%";

    },250);

}


/* =========================
   BREAK BLOCK
========================= */

function breakBlock(){

    showMessage("BLOCK BROKEN");

    hunger--;

    if(hunger < 0)
        hunger = 0;

}


/* =========================
   PLACE BLOCK
========================= */

function placeBlock(){

    showMessage("BLOCK PLACED");

}


/* =========================
   CONTROLS
========================= */

document
.getElementById("up")
.onclick = forward;

document
.getElementById("down")
.onclick = backward;

document
.getElementById("left")
.onclick = turnLeft;

document
.getElementById("right")
.onclick = turnRight;

document
.getElementById("jump")
.onclick = jump;

document
.getElementById("break")
.onclick = breakBlock;

document
.getElementById("place")
.onclick = placeBlock;


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
    "keydown",
    function(event){

        if(event.key === "ArrowUp")
            forward();

        if(event.key === "ArrowDown")
            backward();

        if(event.key === "ArrowLeft")
            turnLeft();

        if(event.key === "ArrowRight")
            turnRight();

        if(
            event.key === "Enter" ||
            event.key === " "
        )
            jump();

        if(event.key === "e")
            breakBlock();

        if(event.key === "q")
            placeBlock();

    }
);


/* =========================
   HOTBAR
========================= */

document
.querySelectorAll(".slot")
.forEach(function(slot,index){

    slot.onclick =
        function(){

            document
            .querySelectorAll(".slot")
            .forEach(function(s){

                s.classList.remove(
                    "selected"
                );

            });

            slot.classList.add(
                "selected"
            );

            selectedBlock =
                index;

            showMessage(
                "SLOT " + (index + 1)
            );

        };

});


/* =========================
   INITIALIZE
========================= */

updateCoords();

</script>

</body>
</html>
